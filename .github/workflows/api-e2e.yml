name: API end-to-end baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_COVERAGE_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build test harness and API
        run: dotnet build tests/WowsKarma.Api.E2E/WowsKarma.Api.E2E.csproj
      - name: Restore coverage tool
        run: dotnet tool restore
      - name: Run TUnit with Aspire and collect API coverage
        id: api-tests
        run: >-
          dotnet tool run dotnet-coverage collect --settings tests/api-coverage.xml
          --include-files "$PWD/WowsKarma.Api/bin/Debug/net10.0/WowsKarma.Api.dll"
          --output-format cobertura --output tests/TestResults/api-coverage.cobertura.xml
          "dotnet run --project tests/WowsKarma.Api.E2E --no-build -- --report-trx --results-directory tests/TestResults"
      - name: Summarize API coverage
        if: ${{ !cancelled() && steps.api-tests.outcome != 'skipped' }}
        shell: pwsh
        run: ./tests/Measure-ApiCoverage.ps1 | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-results
          path: tests/TestResults/
          if-no-files-found: warn
