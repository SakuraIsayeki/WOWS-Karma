name: .NET Build & Test

permissions: 
  contents: read

env:
  SOLUTION: 'WoWS-Karma.slnx'

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      configuration:
        type: string
        default: Debug
      continue-on-test-error:
        type: boolean
        default: false

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Debug' }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: 'recursive'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore "$SOLUTION"

    - name: Build
      run: dotnet build "$SOLUTION" --no-restore --configuration "$CONFIGURATION"

    - name: Test
      continue-on-error: ${{ inputs.continue-on-test-error || false }}
      run: dotnet test --solution "$SOLUTION" --no-build --configuration "$CONFIGURATION"
